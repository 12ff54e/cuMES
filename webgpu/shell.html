<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cuMES WebGPU</title>
  <style>
    body { margin: 2rem auto; max-width: 60rem; padding: 0 1rem;
           background: #10151c; color: #e8eef6; font: 16px system-ui; }
    pre { padding: 1rem; border: 1px solid #354455; background: #090d12;
          white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>cuMES WebGPU backend</h1>
  <p>
    <a href="?solve=w7x">Run full W7-X solve</a>
    · <a href="?">Run conformance/Solovev suite</a>
    · <a id="download" hidden>Download converged equilibrium</a>
  </p>
  <pre id="output">Loading WebAssembly and requesting WebGPU…
</pre>
  <script>
    const output = document.getElementById('output');
    const w7xSolve = new URLSearchParams(window.location.search)
      .get('solve') === 'w7x';
    const append = (line) => {
      output.append(document.createTextNode(line + '\n'));
    };
    const publishLine = (line) => {
      if (!w7xSolve) {
        append(line);
        return;
      }
      const progress = line.match(/host controller: PASS \(iter=(\d+)/);
      if (progress) {
        const iteration = Number(progress[1]);
        if (iteration <= 3 || iteration % 50 === 0) append(line);
        return;
      }
      if (/running complete|stage .*converged|stage prolongation|published|self-test|FATAL/.test(line)) {
        append(line);
      }
    };
    var Module = {
      print: (...args) => publishLine(args.join(' ')),
      printErr: (...args) => append('ERROR: ' + args.join(' '))
    };
    window.cumesKeepAlive = setInterval(() => {}, 50);
    window.cumesDeadline = setTimeout(() => {
      if (!document.body.dataset.cumesWebgpu) {
        document.body.dataset.cumesWebgpu = 'fail';
        document.body.dataset.cumesDetail = 'WebGPU self-test timed out';
        append('ERROR: WebGPU self-test timed out');
      }
      clearInterval(window.cumesKeepAlive);
    }, w7xSolve ? 21600000 : 600000);
    window.addEventListener('error', (event) => {
      document.body.dataset.cumesWebgpu = 'fail';
      document.body.dataset.cumesDetail = event.message;
      append('ERROR: ' + event.message);
    });
    window.addEventListener('unhandledrejection', (event) => {
      document.body.dataset.cumesWebgpu = 'fail';
      document.body.dataset.cumesDetail = String(event.reason);
      append('ERROR: ' + event.reason);
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
