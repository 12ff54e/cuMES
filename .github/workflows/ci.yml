# ci.yml — cuMES continuous integration (completion plan step 4.3).
#
# Hosted CPU-only CI. No self-hosted GPU runner is required:
#   - host-matrix (GitHub Ubuntu 22.04, no GPU): the build matrices that do
#     not need a device — verify (precise double, warnings-as-errors),
#     nobackend (binary-only I/O path), netcdf-only, hdf5-only (the optional-
#     backend matrix, completion-plan follow-up §3.3), and float
#     (mixed-float). Building CUDA TUs on the hosted runner works (nvcc from
#     the pinned Jimver/cuda-toolkit action); only tests that never launch
#     kernels run.
#   - host-asan: the ASan/UBSan host-only tests from the sanitizer preset.
#
# GPU/Compute-Sanitizer/trajectory gates remain manual and explicitly
# postponed until suitable hardware is available. They are not represented by
# a permanently queued self-hosted job.
name: ci

on:
  push:
  pull_request:

jobs:
  host-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: verify
            binary-dir: build
          - preset: nobackend
            binary-dir: build-nobackend
          - preset: netcdf-only
            binary-dir: build-netcdf-only
          - preset: hdf5-only
            binary-dir: build-hdf5-only
          - preset: float
            binary-dir: build-float
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (build only; no GPU needed)
        # v0.2 is not a published tag. Pin the verified v0.2.35 commit so a
        # moving action release cannot silently change the build environment.
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.1.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcufft-dev"]'
          log-file-suffix: '${{ matrix.preset }}.txt'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libnetcdf-dev libhdf5-serial-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          CMAKE_CUDA_HOST_COMPILER: /usr/bin/g++-12
      - name: Build
        run: cmake --build ${{ matrix.binary-dir }} -j2
      - name: Host-only tests
        run: ctest --test-dir ${{ matrix.binary-dir }} -R 'test_controller|test_host_config|test_host_io|test_checkpoint|test_input_json|test_io_restart_offsets|test_io_malformed_shapes' --output-on-failure

  host-asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (build only)
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.1.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcufft-dev"]'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libnetcdf-dev libhdf5-serial-dev
      - name: Configure (sanitizer preset)
        run: cmake --preset sanitizer
        env:
          CMAKE_CUDA_HOST_COMPILER: /usr/bin/g++-12
      - name: Build
        run: cmake --build build-sanitize -j2
      - name: ASan/UBSan host tests
        run: ctest --test-dir build-sanitize -R 'asan_test' --output-on-failure
