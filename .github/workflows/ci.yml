# ci.yml — cuMES continuous integration (completion plan step 4.3).
#
# Two lanes:
#   - host-matrix (GitHub ubuntu-latest, no GPU): the build matrices that do
#     not need a device — verify (precise double, warnings-as-errors),
#     nobackend (binary-only I/O path), netcdf-only, hdf5-only (the optional-
#     backend matrix, completion-plan follow-up §3.3), float (mixed-float),
#     and the ASan/UBSan host tests from the sanitizer preset. Building CUDA
#     TUs on the hosted runner works (nvcc from the Jimver/cuda-toolkit
#     action); only tests that never launch kernels run here.
#   - gpu (self-hosted runner labelled [self-hosted, gpu]): the full CTest
#     suite including the compute-sanitizer memcheck/initcheck variants, the
#     CLI policy gate, the benchmark smoke gate, and a frozen short-trajectory
#     sanity run. The job stays queued (not failed) when no GPU runner is
#     attached; attach one to complete the release gate.
name: ci

on:
  push:
  pull_request:

jobs:
  host-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: verify
            binary-dir: build
          - preset: nobackend
            binary-dir: build-nobackend
          - preset: netcdf-only
            binary-dir: build-netcdf-only
          - preset: hdf5-only
            binary-dir: build-hdf5-only
          - preset: float
            binary-dir: build-float
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (build only; no GPU needed)
        uses: Jimver/cuda-toolkit@v0.2
        with:
          cuda: '12.1.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cufft-dev"]'
          linux-local-args: '["--toolkit"]'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libnetcdf-dev libhdf5-serial-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          CMAKE_CUDA_HOST_COMPILER: /usr/bin/g++-12
      - name: Build
        run: cmake --build ${{ matrix.binary-dir }} -j2
      - name: Host-only tests
        run: ctest --test-dir ${{ matrix.binary-dir }} -R 'test_controller|test_host_config|test_host_io|test_checkpoint|test_input_json|test_io_restart_offsets' --output-on-failure

  host-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit (build only)
        uses: Jimver/cuda-toolkit@v0.2
        with:
          cuda: '12.1.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cufft-dev"]'
          linux-local-args: '["--toolkit"]'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libnetcdf-dev libhdf5-serial-dev
      - name: Configure (sanitizer preset)
        run: cmake --preset sanitizer
        env:
          CMAKE_CUDA_HOST_COMPILER: /usr/bin/g++-12
      - name: Build
        run: cmake --build build-sanitize -j2
      - name: ASan/UBSan host tests
        run: ctest --test-dir build-sanitize -R 'asan_test' --output-on-failure

  gpu:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: GPU release gate
        run: bash scripts/ci_gpu.sh

