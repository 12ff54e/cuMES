name: WebGPU Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      fingerprint: ${{ steps.changes.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Browser dependencies
        run: |
          git config submodule.deps/vacuum-field.url https://github.com/12ff54e/vacuum-field.git
          git submodule update --init --recursive deps/webgpu-fft deps/vacuum-field
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '6.0.9'
      - name: Configure and build
        run: |
          emcmake cmake --preset webgpu -B "$RUNNER_TEMP/cumes-webgpu-build"
          cmake --build "$RUNNER_TEMP/cumes-webgpu-build" -j2
      - name: Browser artifact and host checks
        run: ctest --test-dir "$RUNNER_TEMP/cumes-webgpu-build" --output-on-failure
      - name: Package site
        run: cmake --build "$RUNNER_TEMP/cumes-webgpu-build" --target cumes_webgpu_pages
      - name: Identify deployed environment
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if deployment=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].id // empty'); then
            echo "id=$deployment" >> "$GITHUB_OUTPUT"
          fi
      - name: Last successful deployment
        if: steps.baseline.outputs.id != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cumes-pages-deployed-fingerprint.txt
          key: webgpu-pages-deployed-v1-${{ steps.baseline.outputs.id }}
      - name: Check build inputs for changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          fingerprint_file="$RUNNER_TEMP/cumes-webgpu-build/pages-fingerprint.txt"
          read -r fingerprint < "$fingerprint_file"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || ! cmp -s "$fingerprint_file" "$RUNNER_TEMP/cumes-pages-deployed-fingerprint.txt"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'WebGPU build inputs match the last successful deployment.'
          fi
      - name: Configure Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/cumes-webgpu-build/pages

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record successful deployment
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0] | [.id, .sha] | @tsv')
          read -r deployment revision <<< "$metadata"
          test -n "$deployment"
          test "$revision" = "$GITHUB_SHA"
          echo "id=$deployment" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$PAGES_FINGERPRINT" > "$RUNNER_TEMP/cumes-pages-deployed-fingerprint.txt"
      - name: Save successful deployment fingerprint
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cumes-pages-deployed-fingerprint.txt
          key: webgpu-pages-deployed-v1-${{ steps.deployed.outputs.id }}
