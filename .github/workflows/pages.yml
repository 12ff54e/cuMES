name: WebGPU Pages

on:
  push:
    branches: [webgpu]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Browser dependencies
        run: |
          git config submodule.deps/vacuum-field.url https://github.com/12ff54e/vacuum-field.git
          git submodule update --init --recursive deps/webgpu-fft deps/vacuum-field
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '6.0.9'
      - name: Configure and build
        run: |
          emcmake cmake --preset webgpu -B "$RUNNER_TEMP/cumes-webgpu-build"
          cmake --build "$RUNNER_TEMP/cumes-webgpu-build" -j2
      - name: Browser artifact and host checks
        run: ctest --test-dir "$RUNNER_TEMP/cumes-webgpu-build" --output-on-failure
      - name: Package site
        run: node scripts/package_webgpu_pages.mjs "$RUNNER_TEMP/cumes-webgpu-build/webgpu" "$RUNNER_TEMP/cumes-pages"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/cumes-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
